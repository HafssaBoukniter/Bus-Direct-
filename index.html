<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusDirect | Gestion des Réservations de Sièges</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body class="bg-slate-50 text-slate-800">
    <!--header-->
    <header class="bg-teal-700 text-white">
        <nav class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3">
                <span class="text-4xl"><i class="fa-solid fa-bus" style="color: rgb(255, 255, 255);"></i></span>
                <div>
                    <h1 class="text-2xl font-bold">BusDirect</h1>
                </div>
            </a>
            <div class="flex items-center gap-6">
                <a href="index.html" class="font-semibold border-b-2 border-white pb-1"><i class="fa-regular fa-house" style="color: rgb(255, 255, 255);"></i> Accueil</a>

                <a href="tickets.html"class="font-semibold hover:text-teal-200"><i class="fa-solid fa-ticket" style="color: rgb(255, 255, 255);"></i> Tickets</a>
            </div>
        </nav>
    </header>

    <!--main-->
    <main class="max-w-7xl mx-auto px-6 py-7">
        <section id="trip-information" class="bg-teal-50 border border-teal-100 rounded-xl p-6 mb-5 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 items-center">
            <div class="">
                <h2 class="text-3xl font-bold text-teal-900">
                    Safi <span class="text-teal-600">→</span> Marrakech
                </h2>

                <div class="flex flex-row gap-5">
                    <p class="text-sm text-slate-600 mt-3">
                        <i class="fa-regular fa-calendar-days" style="color: rgb(0, 150, 137);"></i> Date : 27/10/2026
                    </p>
                    <p class="text-sm text-slate-600 mt-3">
                        <i class="fa-regular fa-clock" style="color: rgb(0, 150, 137);"></i> Heure de départ : 08:00
                    </p>

                </div>
            </div>
            <div class="border-l border-teal-200 pl-5">
                <p class="text-sm text-slate-600"><i class="fa-solid fa-chair" style="color: rgb(0, 150, 137);"></i> Places disponibles</p>
                <p class="text-3xl font-bold text-teal-700 mt-1"><span id="places-disponibles">20</span></p>
            </div>
            <div class="border-l border-teal-200 pl-5">
                <p class="text-sm text-slate-600">Recette totale</p>
                <p class="text-3xl font-bold text-slate-800 mt-1">
                    <span id="totale">0</span>
                    <span class="text-lg">DH</span>
                </p>
            </div>
        </section>
        <div class="grid grid-cols-1 lg:grid-cols-5 gap-5">
            <section class="lg:col-span-3 bg-white border border-slate-200 rounded-xl overflow-hidden">

                <div class="flex items-center gap-8 p-5 border-b border-slate-200">

                    <div class="flex items-center gap-2">
                        <span class="w-5 h-5 rounded-lg bg-teal-500"></span>
                        <span class="font-medium">Libre</span>
                    </div>

                    <div class="flex items-center gap-2">
                        <span class="w-5 h-5 rounded-lg bg-rose-500"></span>
                        <span class="font-medium">Occupé</span>
                    </div>

                </div>

                <div class="p-6 sm:p-8 flex justify-center">

                    <div class="bus w-full max-w-2sm rounded-[45px] border-2 border-slate-300 bg-slate-100 p-4 sm:p-6">

                        <div id="plan-sieges" class="grid grid-cols-5 grid-cols[1fr_1fr_1rem_1fr_1fr] max-sm:grid-cols-2 max-sm:grid-cols[1fr_1fr] gap-4 p-2">

                            <button type="button" data-seat="1" class="siege libre flex flex-col justify-center">1</button>
                            <button type="button" data-seat="2" class="siege libre flex flex-col justify-center">2</button>
                            <div class="max-sm:hidden"></div>
                            <button type="button" data-seat="3" class="siege libre flex flex-col justify-center">3</button>
                            <button type="button" data-seat="4" class="siege libre flex flex-col justify-center">4</button>

                            <button type="button" data-seat="5" class="siege libre flex flex-col justify-center">5</button>
                            <button type="button" data-seat="6" class="siege libre flex flex-col justify-center">6</button>
                            <div class="max-sm:hidden"></div>
                            <button type="button" data-seat="7" class="siege libre flex flex-col justify-center">7</button>
                            <button type="button" data-seat="8" class="siege libre flex flex-col justify-center">8</button>

                            <button type="button" data-seat="9" class="siege libre flex flex-col justify-center">9</button>
                            <button type="button" data-seat="10" class="siege libre flex flex-col justify-center">10</button>
                            <div class="max-sm:hidden"></div>
                            <button type="button" data-seat="11" class="siege libre flex flex-col justify-center">11</button>
                            <button type="button" data-seat="12" class="siege libre flex flex-col justify-center">12</button>
                            
                            <button type="button" data-seat="13" class="siege libre flex flex-col justify-center">13</button>
                            <button type="button" data-seat="14" class="siege libre flex flex-col justify-center">14</button>
                            <div class="max-sm:hidden"></div>
                            <button type="button" data-seat="15" class="siege libre flex flex-col justify-center">15</button>
                            <button type="button" data-seat="16" class="siege libre flex flex-col justify-center">16</button>
                            
                            <button type="button" data-seat="17" class="siege libre flex flex-col justify-center">17</button>
                            <button type="button" data-seat="18" class="siege libre flex flex-col justify-center">18</button>
                            <div class="max-sm:hidden"></div>
                            <button type="button" data-seat="19" class="siege libre flex flex-col justify-center">19</button>
                            <button type="button" data-seat="20" class="siege libre flex flex-col justify-center">20</button>

                        </div>
                    </div>
                </div>
            </section>

            <div class="lg:col-span-2 flex flex-col gap-4">

                <section class="bg-white border border-teal-100 rounded-xl p-5">

                    <h2 class="text-lg font-bold text-teal-700 mb-4">
                        <span class="inline-flex items-center justify-center bg-teal-600 text-white rounded-lg w-9 h-9 mr-2"><i class="fa-solid fa-plus" style="color: rgb(255, 255, 255);"></i></span>Réserver une place
                    </h2>

                    <form id="form-reservation">
                        <div class="mb-3">
                            <label for="nom-reservation" class="block text-sm font-medium mb-2">Nom du passager <span class="text-rose-500">*</span></label>
                            <input type="text" id="nom-reservation" name="nom" placeholder="Ex : Hafssa"  class="w-full border border-slate-300 rounded-lg  px-3 py-2.5 outline-none  focus:border-teal-500">
                        </div>
                        <div class="mb-4">
                            <label for="siege-reservation" class="block text-sm font-medium mb-2">Choisir un siège (optionnel)</label>
                            <select id="siege-reservation" name="siege" class="w-full border border-slate-300 rounded-lg px-3 py-2.5 bg-white outline-none focus:border-teal-500">
                            </select>
                        </div>
                        <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-semibold rounded-lg py-3">Réserver</button>
                        <p id="message-reservation" role="status" aria-live="polite" class="text-sm mt-3"></p>
                    </form>

                </section>

                <section class="bg-white border border-blue-100 rounded-xl p-5">
                    <h2 class="text-lg font-bold text-blue-600 mb-4">
                        <span class="inline-flex items-center justify-center bg-blue-600 text-white rounded-lg w-9 h-9 mr-2"><i class="fa-solid fa-pen" style="color: rgb(255, 255, 255);"></i></span>Modifier une réservation
                    </h2>

                    <form id="form-modification">
                        <div class="mb-3">
                            <label for="passager-modification" class="block text-sm font-medium mb-2">Sélectionner un passager
                                <span class="text-rose-500">*</span>
                            </label>

                            <select id="passager-modification" name="passager" required class="w-full border border-slate-300 rounded-lg px-3 py-2.5 bg-white outline-none focus:border-blue-500">
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="nouveau-nom" class="block text-sm font-medium mb-2">Nouveau nom (optionnel)</label>
                            <input type="text" id="nouveau-nom" name="nouveauNom" placeholder="Ex : Nouveau nom" class="w-full border border-slate-300 rounded-lg px-3 py-2.5 outline-none focus:border-blue-500">
                        </div>

                        <div class="mb-4">
                            <label for="nouveau-siege" class="block text-sm font-medium mb-2">Nouveau siège</label>
                            <select id="nouveau-siege" name="nouveauSiege" class="w-full border border-slate-300 rounded-lg px-3 py-2.5 bg-white outline-none focus:border-blue-500">
                            </select>
                        </div>

                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg py-3">Modifier</button>
                        <p id="message-modification" role="status"aria-live="polite" class="text-sm mt-3"></p>
                    </form>
                </section>

                <section class="bg-rose-50 border border-rose-100  rounded-xl p-5">
                    <h2 class="text-lg font-bold text-rose-600 mb-4">
                        <span class="inline-flex items-center justify-center bg-rose-500 text-white rounded-lg w-9 h-9 mr-2"><i class="fa-solid fa-x" style="color: rgb(255, 255, 255);"></i></span>Supprimer une réservation
                    </h2>

                    <form id="form-suppression">
                        <div class="mb-4">
                            <label for="passager-suppression" class="block text-sm font-medium mb-2">Sélectionner un passager<span class="text-rose-500">*</span></label>
                            <select id="passager-suppression" name="passager" required class="w-full border border-slate-300 rounded-lg px-3 py-2.5 bg-white outline-none focus:border-rose-500">
                            </select>
                        </div>

                        <button type="submit" class="w-full bg-rose-500 hover:bg-rose-600 text-white font-semibold rounded-lg py-3">Supprimer</button>

                        <p id="message-suppression" role="status" aria-live="polite" class="text-sm mt-3"></p>
                    </form>

                </section>

            </div>
        </div>
    </main>

    <!--footer-->
    <footer class="border-t border-slate-200 bg-white mt-8">
        <div class="max-w-7xl mx-auto px-6 py-5 text-center text-sm text-slate-500">
            &copy; 2026 BusDirect — Tous droits réservés.
        </div>
    </footer>

    <script src="scripte.js" defer></script>
</body>
</html>
